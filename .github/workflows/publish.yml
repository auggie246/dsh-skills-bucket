name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24' # Ships npm >= 11.5.1, required for OIDC auth
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag v$TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Run smoke test
        run: npm test

      - name: Publish to npm
        # No NODE_AUTH_TOKEN here: with no token set, npm authenticates
        # through OIDC trusted publishing and attaches provenance.
        run: npm publish --provenance --access public
